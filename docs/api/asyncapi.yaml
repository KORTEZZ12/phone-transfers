asyncapi: 3.1.0
info:
  title: События переводов
  version: 1.1.0
  description: |
    Сервис переводов публикует событие при блокировке средств и при каждой смене статуса,
    который видит клиент (TR-27). Внутренние шаги, например HELD → CHECKING, событий не дают.
    События попадают в Kafka через outbox: статус и событие пишутся в одной транзакции,
    отдельный процесс переносит события в топик в порядке записи (ADR-003).

    Гарантия доставки — «хотя бы один раз». Поэтому каждый потребитель обязан:
    1. Пропускать событие, `eventId` которого уже обработан.
    2. Применять событие, только если `transferVersion` больше сохранённой у потребителя.
       Версия растёт монотонно, но в потоке идёт с пропусками: она меняется при каждом
       изменении перевода, а событие есть не у каждого. Пропуск номера — норма, а не потерянное
       событие. Финальный статус событием с меньшей версией не откатывается (TR-29).
    3. Не блокировать партицию: после трёх неудачных попыток событие уходит в топик повтора
       с паузой 1 мин, затем 5 и 15 мин, после исчерпания — в DLQ с алертом. У каждой паузы
       свой топик: событие с паузой 15 мин не задерживает события с паузой 1 мин.

    В событиях нет номеров телефонов и счетов, только идентификаторы клиентов.
  contact:
    name: Кирилл Фадеев, системный аналитик
servers:
  production:
    host: kafka.bank.example:9093
    protocol: kafka-secure
    description: Кластер Kafka банка, вымышленный адрес
defaultContentType: application/json
channels:
  transferEvents:
    address: transfers.events.v1
    title: События переводов
    description: |
      Ключ сообщения — `transferId`: все события одного перевода попадают в одну партицию
      и читаются в порядке публикации. Порядок между разными переводами не гарантируется.
    messages:
      transferStatusChanged:
        $ref: '#/components/messages/TransferStatusChanged'
    bindings:
      kafka:
        topic: transfers.events.v1
        partitions: 12
        replicas: 3
        topicConfiguration:
          cleanup.policy: [delete]
          retention.ms: 1209600000
        bindingVersion: 0.5.0
  consumerRetry:
    address: 'transfers.events.v1.{consumer}.retry.{delay}'
    title: Повтор у потребителя
    description: |
      Событие, которое потребитель не обработал за три попытки. Отдельный топик на каждую паузу:
      1m, 5m, 15m. Потребитель читает топик паузы и обрабатывает событие не раньше,
      чем через эту паузу после попадания в топик.
    parameters:
      consumer:
        $ref: '#/components/parameters/consumer'
      delay:
        $ref: '#/components/parameters/delay'
    messages:
      transferStatusChanged:
        $ref: '#/components/messages/TransferStatusChanged'
  consumerDlq:
    address: 'transfers.events.v1.{consumer}.dlq'
    title: DLQ потребителя
    description: События, которые не удалось обработать после всех повторов. Каждое попадание — алерт, разбор — по runbook
    parameters:
      consumer:
        $ref: '#/components/parameters/consumer'
    messages:
      transferStatusChanged:
        $ref: '#/components/messages/TransferStatusChanged'
operations:
  publishTransferEvent:
    action: send
    channel:
      $ref: '#/channels/transferEvents'
    title: Публикация изменения статуса
    summary: Сервис переводов, через outbox
    messages:
      - $ref: '#/channels/transferEvents/messages/transferStatusChanged'
  notifyParticipants:
    action: receive
    channel:
      $ref: '#/channels/transferEvents'
    title: Пуши отправителю и получателю
    summary: |
      Сервис уведомлений, пуши по матрице «статус × адресат» (TR-28): получателю — только COMPLETED,
      отправителю — ON_REVIEW, AWAITING_CONFIRMATION, DELAYED и финальные статусы. Причину
      FRAUD_SUSPECTED отправитель видит без подробностей. Дедупликация по паре «eventId + адресат»:
      при сбое на одном из двух пушей повтор не задублирует второй. У пуша collapse-key по
      `transferId`, поэтому устройство показывает одно, последнее уведомление о переводе.
    bindings:
      kafka:
        groupId:
          type: string
          enum: [notifications]
        bindingVersion: 0.5.0
    messages:
      - $ref: '#/channels/transferEvents/messages/transferStatusChanged'
  buildHistory:
    action: receive
    channel:
      $ref: '#/channels/transferEvents'
    title: История операций
    summary: Хранит последнее состояние перевода по transferVersion, финальный статус не откатывает
    bindings:
      kafka:
        groupId:
          type: string
          enum: [operations-history]
        bindingVersion: 0.5.0
    messages:
      - $ref: '#/channels/transferEvents/messages/transferStatusChanged'
  deferForRetry:
    action: send
    channel:
      $ref: '#/channels/consumerRetry'
    title: Отложить событие для повтора
    summary: Любой потребитель, после трёх неудачных попыток или неудачного повтора
    messages:
      - $ref: '#/channels/consumerRetry/messages/transferStatusChanged'
  consumeRetry:
    action: receive
    channel:
      $ref: '#/channels/consumerRetry'
    title: Обработать отложенное событие
    summary: Тот же потребитель, после паузы своего топика; не получилось — следующая пауза или DLQ
    messages:
      - $ref: '#/channels/consumerRetry/messages/transferStatusChanged'
  parkInDlq:
    action: send
    channel:
      $ref: '#/channels/consumerDlq'
    title: Отправить событие в DLQ
    summary: Любой потребитель, после повтора с паузой 15 мин
    messages:
      - $ref: '#/channels/consumerDlq/messages/transferStatusChanged'
components:
  parameters:
    consumer:
      description: Группа потребителя
      enum: [notifications, operations-history]
    delay:
      description: Пауза перед повтором
      enum: [1m, 5m, 15m]
  messages:
    TransferStatusChanged:
      name: TransferStatusChanged
      title: Статус перевода изменился
      contentType: application/json
      headers:
        type: object
        required: [eventId, eventType, schemaVersion]
        properties:
          eventId:
            type: string
            format: uuid
          eventType:
            type: string
            const: TransferStatusChanged
          schemaVersion:
            type: string
            const: '1'
          traceparent:
            type: string
            description: W3C Trace Context из запроса, который запустил изменение
      payload:
        $ref: '#/components/schemas/TransferStatusChangedPayload'
      bindings:
        kafka:
          key:
            type: string
            format: uuid
            description: transferId
          bindingVersion: 0.5.0
      examples:
        - name: completed
          summary: Перевод выполнен
          headers:
            eventId: 7e6d5c4b-3a2f-4e1d-8c9b-0a1f2e3d4c5b
            eventType: TransferStatusChanged
            schemaVersion: '1'
            traceparent: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
          payload:
            eventId: 7e6d5c4b-3a2f-4e1d-8c9b-0a1f2e3d4c5b
            occurredAt: '2026-10-19T12:01:04+03:00'
            transferId: 3d2c1b0a-9f8e-4d7c-8b6a-5f4e3d2c1b0a
            transferVersion: 5
            status: COMPLETED
            previousStatus: PROCESSING
            isFinal: true
            rejectReason: null
            amount:
              value: '1500.00'
              currency: RUB
            senderClientId: 1f2e3d4c-5b6a-4978-8a7b-6c5d4e3f2a1b
            recipientClientId: 2a3b4c5d-6e7f-4809-9a1b-2c3d4e5f6a7b
  schemas:
    TransferStatusChangedPayload:
      type: object
      required: [eventId, occurredAt, transferId, transferVersion, status, isFinal, amount, senderClientId, recipientClientId]
      properties:
        eventId:
          type: string
          format: uuid
          description: Совпадает с заголовком eventId, ключ дедупликации
        occurredAt:
          type: string
          format: date-time
          description: Момент изменения статуса в сервисе переводов
        transferId:
          type: string
          format: uuid
        transferVersion:
          type: integer
          minimum: 1
          description: |
            Растёт с каждым изменением перевода; в потоке событий номера идут с пропусками.
            По ней потребитель отбрасывает устаревшие события, но не ищет «пропавшие»
        status:
          type: string
          enum: [PROCESSING, ON_REVIEW, AWAITING_CONFIRMATION, DELAYED, COMPLETED, REJECTED, CANCELLED, FAILED]
        previousStatus:
          type: [string, 'null']
          enum: [PROCESSING, ON_REVIEW, AWAITING_CONFIRMATION, DELAYED, COMPLETED, REJECTED, CANCELLED, FAILED, null]
        isFinal:
          type: boolean
        rejectReason:
          type: [string, 'null']
          description: Только асинхронные отказы. Отказ до блокировки средств событий не даёт (TR-27)
          enum: [FRAUD_SUSPECTED, REVIEW_EXPIRED, NOT_CONFIRMED, RECIPIENT_ACCOUNT_UNAVAILABLE, SOURCE_ACCOUNT_UNAVAILABLE, null]
        amount:
          type: object
          required: [value, currency]
          properties:
            value:
              type: string
              pattern: '^\d{1,15}(\.\d{1,2})?$'
            currency:
              type: string
              enum: [RUB, USD, EUR, CNY]
        senderClientId:
          type: string
          format: uuid
        recipientClientId:
          type: string
          format: uuid
