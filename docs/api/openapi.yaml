openapi: 3.1.0
info:
  title: Переводы по номеру телефона
  version: 1.0.0
  description: |
    API мобильного приложения для переводов между клиентами банка по номеру телефона.
    Соглашения — в [README](README.md): аутентификация, ключ идемпотентности, формат сумм,
    каталог ошибок. Внутренний колбэк антифрода — отдельная спецификация
    `internal-antifraud.yaml` для внутреннего контура.

    Серверные сбои и недоступность зависимых систем во всех операциях выглядят одинаково:
    503 `SERVICE_UNAVAILABLE` с `Retry-After`. Приложение повторяет запрос с тем же ключом
    по правилам TR-10, поэтому в операциях 503 отдельно не описан.

    Отправитель всегда определяется по токену доступа, а не по телу запроса.
    Банк вымышленный, домен `bank.example` зарезервирован для примеров.
  contact:
    name: Кирилл Фадеев, системный аналитик
  license:
    name: CC BY 4.0
    url: https://creativecommons.org/licenses/by/4.0/
servers:
  - url: https://api.bank.example
    description: Внешний контур, через API-шлюз
tags:
  - name: Получатели
    description: Поиск клиента банка по номеру телефона
  - name: Переводы
    description: Создание, статус и отмена перевода
  - name: Лимиты
    description: Сколько ещё можно перевести
security:
  - bearerAuth: []
paths:
  /v1/recipients/lookup:
    post:
      tags: [Получатели]
      operationId: lookupRecipient
      summary: Найти получателя по номеру телефона
      description: |
        POST, а не GET: номер телефона не должен попадать в URL и журналы доступа (TR-01).
        Возвращает токен получателя: перевод создаётся по нему, а не по номеру (TR-02).
        Частота ограничена: P-02 в минуту и P-03 в сутки на отправителя (TR-03). Повтор того же
        номера, пока выданный токен действует, возвращает этот токен и лимит не расходует.
      parameters:
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipientLookupRequest'
            example:
              phone: '+79991234567'
      responses:
        '200':
          description: Получатель найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipientLookup'
              example:
                recipientToken: 6a1f0c9e-2b7d-4c55-9e1a-3f8d2c7b4a10
                displayName: Иван П.
                currencies: [RUB, USD]
                expiresAt: '2026-10-19T12:10:00+03:00'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Клиента банка с таким номером нет, он заблокирован или у него нет открытого основного счёта — причина не раскрывается (TR-05)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://api.bank.example/problems/recipient-not-found
                title: Получатель не найден
                status: 404
                code: RECIPIENT_NOT_FOUND
                detail: Клиента банка с этим номером нет. Проверьте номер.
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        '422':
          description: Нельзя перевести самому себе
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://api.bank.example/problems/self-transfer
                title: Это ваш номер
                status: 422
                code: SELF_TRANSFER
                detail: Для перевода себе используйте перевод между своими счетами.
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        '429':
          $ref: '#/components/responses/LookupRateLimited'
  /v1/transfers:
    post:
      tags: [Переводы]
      operationId: createTransfer
      summary: Создать перевод
      description: |
        Синхронно: проверка лимита, его резерв и блокировка суммы на счёте (TR-08, TR-12, TR-13).
        Дальше асинхронно: антифрод и проводка. Итог — в `GET /v1/transfers/{transferId}` и пуше.

        Порядок проверок (TR-11):
        1. Токен доступа и формат запроса — 401, 400.
        2. `Idempotency-Key`. Если перевод с этим ключом уже есть, ответ строится только по нему:
           200 с актуальным статусом и `Idempotent-Replayed: true`, тот же отказ, если исходный
           запрос отклонён, 409, пока действует аренда первого запроса (TR-34), или 422
           `IDEMPOTENCY_KEY_REUSED`, если тело другое. Срока у повтора нет.
        3. Только для нового ключа: токен получателя, счёт списания, лимит, остаток.

        Тело для сравнения нормализуется — правила в соглашениях API.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransferRequest'
            example:
              recipientToken: 6a1f0c9e-2b7d-4c55-9e1a-3f8d2c7b4a10
              sourceAccountId: 0b8e7d6c-5a4f-4e3d-9c2b-1a0f9e8d7c6b
              amount:
                value: '1500.00'
                currency: RUB
              comment: За билеты
      responses:
        '201':
          description: Перевод принят, сумма заблокирована
          headers:
            Location:
              description: Адрес перевода
              schema:
                type: string
              example: /v1/transfers/3d2c1b0a-9f8e-4d7c-8b6a-5f4e3d2c1b0a
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transfer'
              example:
                id: 3d2c1b0a-9f8e-4d7c-8b6a-5f4e3d2c1b0a
                status: PROCESSING
                rejectReason: null
                amount:
                  value: '1500.00'
                  currency: RUB
                recipient:
                  displayName: Иван П.
                sourceAccountId: 0b8e7d6c-5a4f-4e3d-9c2b-1a0f9e8d7c6b
                comment: За билеты
                cancellable: false
                createdAt: '2026-10-19T12:01:03+03:00'
                updatedAt: '2026-10-19T12:01:03+03:00'
                completedAt: null
        '200':
          description: Повтор запроса с тем же ключом. Перевод с актуальным статусом
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transfer'
              example:
                id: 3d2c1b0a-9f8e-4d7c-8b6a-5f4e3d2c1b0a
                status: COMPLETED
                rejectReason: null
                amount:
                  value: '1500.00'
                  currency: RUB
                recipient:
                  displayName: Иван П.
                sourceAccountId: 0b8e7d6c-5a4f-4e3d-9c2b-1a0f9e8d7c6b
                comment: За билеты
                cancellable: false
                createdAt: '2026-10-19T12:01:03+03:00'
                updatedAt: '2026-10-19T12:01:04+03:00'
                completedAt: '2026-10-19T12:01:04+03:00'
        '400':
          description: Ошибка в запросе или нет ключа идемпотентности
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                validation:
                  $ref: '#/components/examples/ValidationError'
                noKey:
                  summary: Нет заголовка Idempotency-Key
                  value:
                    type: https://api.bank.example/problems/idempotency-key-required
                    title: Нужен ключ идемпотентности
                    status: 400
                    code: IDEMPOTENCY_KEY_REQUIRED
                    detail: Передайте заголовок Idempotency-Key.
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Счёт списания не принадлежит отправителю
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://api.bank.example/problems/account-not-owned
                title: Счёт недоступен
                status: 403
                code: ACCOUNT_NOT_OWNED
                detail: С этого счёта нельзя переводить.
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        '409':
          description: Первый запрос с этим ключом ещё выполняется, аренда P-14 (TR-34)
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://api.bank.example/problems/idempotency-key-in-progress
                title: Перевод ещё создаётся
                status: 409
                code: IDEMPOTENCY_KEY_IN_PROGRESS
                detail: Повторите запрос с тем же ключом через секунду.
                retryAfterSeconds: 1
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        '422':
          description: Перевод отклонён до блокировки средств, или ключ уже использован с другими данными
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                limit:
                  summary: Превышен лимит
                  value:
                    type: https://api.bank.example/problems/limit-exceeded
                    title: Превышен лимит
                    status: 422
                    code: LIMIT_EXCEEDED
                    detail: Сегодня можно перевести ещё 20 000 ₽.
                    limit:
                      period: DAY
                      available:
                        value: '20000.00'
                        currency: RUB
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                funds:
                  summary: Не хватает денег
                  value:
                    type: https://api.bank.example/problems/insufficient-funds
                    title: Недостаточно средств
                    status: 422
                    code: INSUFFICIENT_FUNDS
                    detail: На счёте недостаточно денег для перевода.
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                tokenExpired:
                  summary: Токен получателя истёк
                  value:
                    type: https://api.bank.example/problems/recipient-token-expired
                    title: Найдите получателя ещё раз
                    status: 422
                    code: RECIPIENT_TOKEN_EXPIRED
                    detail: С момента поиска прошло больше 10 минут.
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                currency:
                  summary: У получателя нет счёта в этой валюте
                  value:
                    type: https://api.bank.example/problems/recipient-currency-unavailable
                    title: Получатель не принимает эту валюту
                    status: 422
                    code: RECIPIENT_CURRENCY_UNAVAILABLE
                    detail: У получателя нет основного счёта в долларах. Доступно — рубли.
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                sourceAccount:
                  summary: Счёт списания заблокирован или закрыт
                  value:
                    type: https://api.bank.example/problems/source-account-unavailable
                    title: С этого счёта сейчас нельзя переводить
                    status: 422
                    code: SOURCE_ACCOUNT_UNAVAILABLE
                    detail: Счёт заблокирован или закрыт. Выберите другой счёт.
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                keyReused:
                  summary: Ключ уже использован для другого перевода
                  value:
                    type: https://api.bank.example/problems/idempotency-key-reused
                    title: Ключ уже использован для другого перевода
                    status: 422
                    code: IDEMPOTENCY_KEY_REUSED
                    detail: Перевод с этим ключом уже создан с другими данными. Откройте его, повторно не отправляйте.
                    existingTransferId: 3d2c1b0a-9f8e-4d7c-8b6a-5f4e3d2c1b0a
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
  /v1/transfers/{transferId}:
    get:
      tags: [Переводы]
      operationId: getTransfer
      summary: Статус перевода
      description: |
        Отправитель видит только свои переводы. Чужой перевод возвращает 404, а не 403,
        чтобы не раскрывать, что такой перевод существует.
      parameters:
        - $ref: '#/components/parameters/TransferId'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Перевод
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transfer'
              example:
                id: 3d2c1b0a-9f8e-4d7c-8b6a-5f4e3d2c1b0a
                status: ON_REVIEW
                rejectReason: null
                amount:
                  value: '150000.00'
                  currency: RUB
                recipient:
                  displayName: Иван П.
                sourceAccountId: 0b8e7d6c-5a4f-4e3d-9c2b-1a0f9e8d7c6b
                comment: null
                cancellable: true
                createdAt: '2026-10-19T12:01:03+03:00'
                updatedAt: '2026-10-19T12:01:05+03:00'
                completedAt: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/TransferNotFound'
  /v1/transfers/{transferId}/cancel:
    post:
      tags: [Переводы]
      operationId: cancelTransfer
      summary: Отменить перевод на проверке
      description: |
        Отменить можно перевод в статусах ON_REVIEW, AWAITING_CONFIRMATION и DELAYED (TR-22).
        Повторная отмена отменённого перевода возвращает 200 и тот же перевод, поэтому ключ
        идемпотентности не нужен. Если одновременно пришло решение антифрода или подтверждение,
        применяется то, что зафиксировано первым (TR-23).
      parameters:
        - $ref: '#/components/parameters/TransferId'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Перевод отменён, сумма разблокирована
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transfer'
              example:
                id: 3d2c1b0a-9f8e-4d7c-8b6a-5f4e3d2c1b0a
                status: CANCELLED
                rejectReason: null
                amount:
                  value: '150000.00'
                  currency: RUB
                recipient:
                  displayName: Иван П.
                sourceAccountId: 0b8e7d6c-5a4f-4e3d-9c2b-1a0f9e8d7c6b
                comment: null
                cancellable: false
                createdAt: '2026-10-19T12:01:03+03:00'
                updatedAt: '2026-10-19T12:20:41+03:00'
                completedAt: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/TransferNotFound'
        '409':
          description: Перевод уже нельзя отменить
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://api.bank.example/problems/transfer-not-cancellable
                title: Перевод уже нельзя отменить
                status: 409
                code: TRANSFER_NOT_CANCELLABLE
                detail: Перевод уже выполнен.
                currentStatus: COMPLETED
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
  /v1/transfers/{transferId}/confirm:
    post:
      tags: [Переводы]
      operationId: confirmTransfer
      summary: Подтвердить перевод, приостановленный по 161-ФЗ
      description: |
        Перевод в статусе AWAITING_CONFIRMATION приостановлен: антифрод нашёл признаки перевода
        без добровольного согласия клиента (TR-35). Подтвердить можно до `confirmationDeadline` (TR-36).
        После подтверждения антифрод заново сверяется с базой Банка России: перевод идёт в обработку
        или откладывается до `executeAfter` (TR-37).

        Подтверждение идемпотентно: повторное подтверждение подтверждённого перевода возвращает 200
        и тот же перевод (TR-38). Если одновременно пришла отмена, применяется то, что зафиксировано первым (TR-23).
      parameters:
        - $ref: '#/components/parameters/TransferId'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Перевод подтверждён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transfer'
              example:
                id: 3d2c1b0a-9f8e-4d7c-8b6a-5f4e3d2c1b0a
                status: PROCESSING
                rejectReason: null
                amount:
                  value: '150000.00'
                  currency: RUB
                recipient:
                  displayName: Иван П.
                sourceAccountId: 0b8e7d6c-5a4f-4e3d-9c2b-1a0f9e8d7c6b
                comment: null
                cancellable: false
                confirmable: false
                confirmationDeadline: null
                executeAfter: null
                createdAt: '2026-10-19T12:01:03+03:00'
                updatedAt: '2026-10-19T18:40:12+03:00'
                completedAt: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/TransferNotFound'
        '409':
          description: Перевод уже нельзя подтвердить
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://api.bank.example/problems/transfer-not-confirmable
                title: Перевод уже нельзя подтвердить
                status: 409
                code: TRANSFER_NOT_CONFIRMABLE
                detail: Срок подтверждения истёк, перевод отклонён.
                currentStatus: REJECTED
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
  /v1/transfer-limits:
    get:
      tags: [Лимиты]
      operationId: getTransferLimits
      summary: Доступные лимиты отправителя
      description: Суммы в рублях. В «использовано» входят и незавершённые переводы (TR-08).
      parameters:
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Лимиты
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferLimits'
              example:
                perOperation:
                  value: '300000.00'
                  currency: RUB
                day:
                  limit:
                    value: '500000.00'
                    currency: RUB
                  used:
                    value: '480000.00'
                    currency: RUB
                  available:
                    value: '20000.00'
                    currency: RUB
                  resetsAt: '2026-10-20T00:00:00+03:00'
                month:
                  limit:
                    value: '2000000.00'
                    currency: RUB
                  used:
                    value: '640000.00'
                    currency: RUB
                  available:
                    value: '1360000.00'
                    currency: RUB
                  resetsAt: '2026-11-01T00:00:00+03:00'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Токен приложения. Отправитель берётся из токена.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        UUID, который приложение создаёт один раз на экране подтверждения и повторяет
        по правилам TR-10. Уникален в пределах отправителя, хранится вместе с переводом,
        повтор распознаётся без срока (TR-11).
      schema:
        type: string
        format: uuid
      example: 5f0e6a2b-7c1d-4e8f-9a3b-2c4d6e8f0a1b
    DeviceId:
      name: X-Device-Id
      in: header
      required: true
      description: Идентификатор устройства, нужен антифроду
      schema:
        type: string
        maxLength: 128
      example: ios-7F3A9C21-5B8E
    Traceparent:
      name: traceparent
      in: header
      required: false
      description: W3C Trace Context. Если нет, шлюз создаёт новый.
      schema:
        type: string
      example: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
    TransferId:
      name: transferId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 3d2c1b0a-9f8e-4d7c-8b6a-5f4e3d2c1b0a
  headers:
    RetryAfter:
      description: Через сколько секунд повторить
      schema:
        type: integer
        minimum: 1
      example: 30
    IdempotentReplayed:
      description: Ответ на повтор запроса с тем же ключом
      schema:
        type: string
        enum: ['true']
  examples:
    ValidationError:
      summary: Ошибка в данных
      value:
        type: https://api.bank.example/problems/validation-error
        title: Ошибка в данных
        status: 400
        code: VALIDATION_ERROR
        detail: Сумма — от 1 до лимита на операцию, не больше двух знаков после запятой.
        errors:
          - field: amount.value
            message: Неверный формат суммы
        traceId: 4bf92f3577b34da6a3ce929d0e0e4736
  responses:
    ValidationError:
      description: Ошибка в данных запроса
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            validation:
              $ref: '#/components/examples/ValidationError'
    Unauthorized:
      description: Нет или истёк токен доступа
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.bank.example/problems/unauthorized
            title: Нужно войти заново
            status: 401
            code: UNAUTHORIZED
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    TransferNotFound:
      description: Перевод не найден или принадлежит другому клиенту
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.bank.example/problems/transfer-not-found
            title: Перевод не найден
            status: 404
            code: TRANSFER_NOT_FOUND
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    LookupRateLimited:
      description: Слишком много поисков
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.bank.example/problems/lookup-rate-limited
            title: Слишком много запросов
            status: 429
            code: LOOKUP_RATE_LIMITED
            detail: Попробуйте через 2 минуты.
            retryAfterSeconds: 120
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
  schemas:
    Money:
      type: object
      required: [value, currency]
      description: Сумма строкой, чтобы не терять копейки на числах с плавающей точкой
      properties:
        value:
          type: string
          pattern: '^\d{1,15}(\.\d{1,2})?$'
          example: '1500.00'
        currency:
          $ref: '#/components/schemas/Currency'
    Currency:
      type: string
      description: ISO 4217
      enum: [RUB, USD, EUR, CNY]
    RecipientLookupRequest:
      type: object
      required: [phone]
      properties:
        phone:
          type: string
          description: E.164, только российские номера
          pattern: '^\+7\d{10}$'
    RecipientLookup:
      type: object
      required: [recipientToken, displayName, currencies, expiresAt]
      properties:
        recipientToken:
          type: string
          format: uuid
          description: Действует P-01 и только для этого отправителя (TR-02)
        displayName:
          type: string
          description: Имя и первая буква фамилии
          example: Иван П.
        currencies:
          type: array
          description: Валюты, в которых у получателя есть основной счёт (TR-05)
          minItems: 1
          items:
            $ref: '#/components/schemas/Currency'
        expiresAt:
          type: string
          format: date-time
    CreateTransferRequest:
      type: object
      required: [recipientToken, sourceAccountId, amount]
      properties:
        recipientToken:
          type: string
          format: uuid
        sourceAccountId:
          type: string
          format: uuid
        amount:
          $ref: '#/components/schemas/Money'
          description: От 1 единицы валюты до лимита на операцию, не больше двух знаков после запятой (TR-06)
        comment:
          type: [string, 'null']
          maxLength: 140
    TransferStatus:
      type: string
      description: |
        Статус для клиента. Внутренние статусы сервиса отображаются так:
        NEW, HELD, CHECKING, POSTING → PROCESSING; REVIEW → ON_REVIEW;
        SUSPENDED → AWAITING_CONFIRMATION; COOLING → DELAYED; остальные совпадают.
        См. статусную модель.
      enum: [PROCESSING, ON_REVIEW, AWAITING_CONFIRMATION, DELAYED, COMPLETED, REJECTED, CANCELLED, FAILED]
    RejectReason:
      type: string
      description: |
        Причина асинхронного отказа. Отказы до блокировки средств — лимит, остаток, счёт —
        приходят синхронно ответом 422 и в ресурсе перевода не встречаются (соглашения API).
      enum:
        - FRAUD_SUSPECTED
        - REVIEW_EXPIRED
        - NOT_CONFIRMED
        - RECIPIENT_ACCOUNT_UNAVAILABLE
        - SOURCE_ACCOUNT_UNAVAILABLE
    Transfer:
      type: object
      required: [id, status, amount, recipient, sourceAccountId, cancellable, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/TransferStatus'
        rejectReason:
          description: Заполнено только для REJECTED
          oneOf:
            - $ref: '#/components/schemas/RejectReason'
            - type: 'null'
        amount:
          $ref: '#/components/schemas/Money'
        recipient:
          type: object
          required: [displayName]
          properties:
            displayName:
              type: string
        sourceAccountId:
          type: string
          format: uuid
        comment:
          type: [string, 'null']
        cancellable:
          type: boolean
          description: Можно ли отменить прямо сейчас
        confirmable:
          type: boolean
          description: Можно ли подтвердить прямо сейчас — только для AWAITING_CONFIRMATION
        confirmationDeadline:
          type: [string, 'null']
          format: date-time
          description: До какого момента можно подтвердить приостановленный перевод (P-20)
        executeAfter:
          type: [string, 'null']
          format: date-time
          description: Не раньше какого момента будет исполнен отложенный перевод (P-21)
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        completedAt:
          type: [string, 'null']
          format: date-time
    LimitPeriod:
      type: object
      required: [limit, used, available, resetsAt]
      properties:
        limit:
          $ref: '#/components/schemas/Money'
        used:
          $ref: '#/components/schemas/Money'
        available:
          $ref: '#/components/schemas/Money'
        resetsAt:
          type: string
          format: date-time
    TransferLimits:
      type: object
      required: [perOperation, day, month]
      properties:
        perOperation:
          $ref: '#/components/schemas/Money'
        day:
          $ref: '#/components/schemas/LimitPeriod'
        month:
          $ref: '#/components/schemas/LimitPeriod'
    Problem:
      type: object
      description: RFC 9457 Problem Details плюс машиночитаемый код
      required: [type, title, status, code, traceId]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
          description: Текст для человека, приложение может показать его как есть
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          description: Машиночитаемый код, по нему приложение решает, что делать
          enum:
            - VALIDATION_ERROR
            - UNAUTHORIZED
            - ACCOUNT_NOT_OWNED
            - RECIPIENT_NOT_FOUND
            - SELF_TRANSFER
            - LOOKUP_RATE_LIMITED
            - IDEMPOTENCY_KEY_REQUIRED
            - IDEMPOTENCY_KEY_IN_PROGRESS
            - IDEMPOTENCY_KEY_REUSED
            - RECIPIENT_TOKEN_EXPIRED
            - LIMIT_EXCEEDED
            - INSUFFICIENT_FUNDS
            - RECIPIENT_CURRENCY_UNAVAILABLE
            - SOURCE_ACCOUNT_UNAVAILABLE
            - TRANSFER_NOT_FOUND
            - TRANSFER_NOT_CANCELLABLE
            - TRANSFER_NOT_CONFIRMABLE
            - SERVICE_UNAVAILABLE
        traceId:
          type: string
          description: Для обращения в поддержку
        retryAfterSeconds:
          type: integer
        currentStatus:
          $ref: '#/components/schemas/TransferStatus'
        existingTransferId:
          type: string
          format: uuid
          description: Перевод, уже созданный с этим ключом. Есть только у IDEMPOTENCY_KEY_REUSED
        limit:
          type: object
          required: [period, available]
          properties:
            period:
              type: string
              enum: [OPERATION, DAY, MONTH]
            available:
              $ref: '#/components/schemas/Money'
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string
