openapi: 3.1.0
info:
  title: Сервис переводов — внутренние вызовы
  version: 1.0.0
  description: |
    Вызовы от систем банка во внутреннем контуре, не из приложения. Отдельно от публичной
    спецификации, чтобы внутренний адрес и колбэк не попали в документацию внешнего API.
    Общие схемы — статус перевода, ошибки — берутся из `openapi.yaml`.
  contact:
    name: Кирилл Фадеев, системный аналитик
  license:
    name: CC BY 4.0
    url: https://creativecommons.org/licenses/by/4.0/
servers:
  - url: https://transfers.internal.bank.example
    description: Внутренний контур, только mTLS
tags:
  - name: Антифрод
    description: Решения антифрода по ручной проверке
security:
  - antifraudMtls: []
paths:
  /internal/v1/antifraud/decisions:
    post:
      tags: [Антифрод]
      operationId: receiveAntifraudDecision
      summary: Решение антифрода по ручной проверке
      description: |
        Вызывает антифрод, когда сотрудник принял решение. Идемпотентно по `decisionId`.
        Решение SUSPEND приостанавливает перевод до подтверждения клиентом (TR-35).
        Если перевод ещё в CHECKING, решение сохраняется и применяется при переходе в REVIEW.
        Если перевод уже в финальном статусе (отменён отправителем или истёк срок проверки),
        ответ — 200 с `applied: false` и текущим статусом: антифроду нечего исправлять,
        ему нужно только закрыть кейс. Ошибка 4xx тут бесполезна, на неё нельзя отреагировать.
      parameters:
        - $ref: './openapi.yaml#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AntifraudDecision'
            example:
              decisionId: 9c8b7a6f-5e4d-4c3b-8a2f-1e0d9c8b7a6f
              transferId: 3d2c1b0a-9f8e-4d7c-8b6a-5f4e3d2c1b0a
              decision: ALLOW
              decidedAt: '2026-10-19T12:20:40+03:00'
              reasonCode: null
      responses:
        '200':
          description: Решение принято к сведению
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AntifraudDecisionResult'
              examples:
                applied:
                  summary: Решение применено
                  value:
                    applied: true
                    transferStatus: PROCESSING
                tooLate:
                  summary: Перевод уже отменён отправителем
                  value:
                    applied: false
                    transferStatus: CANCELLED
        '400':
          $ref: './openapi.yaml#/components/responses/ValidationError'
        '404':
          $ref: './openapi.yaml#/components/responses/TransferNotFound'
components:
  securitySchemes:
    antifraudMtls:
      type: mutualTLS
      description: Взаимный TLS, сертификат системы антифрода из доверенного списка
  schemas:
    AntifraudDecision:
      type: object
      required: [decisionId, transferId, decision, decidedAt]
      properties:
        decisionId:
          type: string
          format: uuid
        transferId:
          type: string
          format: uuid
        decision:
          type: string
          enum: [ALLOW, DENY, SUSPEND]
        decidedAt:
          type: string
          format: date-time
        reasonCode:
          type: [string, 'null']
    AntifraudDecisionResult:
      type: object
      required: [applied, transferStatus]
      properties:
        applied:
          type: boolean
          description: false — перевод уже был в финальном статусе
        transferStatus:
          $ref: './openapi.yaml#/components/schemas/TransferStatus'
