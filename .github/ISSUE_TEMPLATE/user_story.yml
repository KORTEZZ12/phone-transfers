name: Пользовательская история
description: Требование в формате «как… я хочу… чтобы…» с критериями приёмки
title: "US-XX: "
labels: ["история"]
body:
  - type: input
    id: role
    attributes:
      label: Как
      placeholder: отправитель / получатель / служба безопасности / операционный отдел
    validations:
      required: true
  - type: textarea
    id: want
    attributes:
      label: Я хочу
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Чтобы
    validations:
      required: true
  - type: textarea
    id: ac
    attributes:
      label: Критерии приёмки
      description: Gherkin на русском — Сценарий, Дано, Когда, Тогда
      render: gherkin
    validations:
      required: true
  - type: input
    id: trace
    attributes:
      label: Правила
      placeholder: TR-08, строка 4 таблицы отказов
  - type: dropdown
    id: priority
    attributes:
      label: Приоритет
      options: ["Must", "Should", "Could", "Won't"]
    validations:
      required: true
